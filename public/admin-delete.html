<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イベント削除 - Between Admin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: linear-gradient(135deg, #4a6fa5 0%, #6a8db5 30%, #a89884 70%, #be896f 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #FFFFFF;
      font-size: 28px;
      margin-bottom: 10px;
      text-align: center;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      text-align: center;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
      font-size: 16px;
      transition: all 0.3s;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.5);
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 100, 100, 0.3);
      background: rgba(255, 100, 100, 0.25);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    button:hover {
      background: rgba(255, 100, 100, 0.35);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 100, 100, 0.3);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      color: #FFFFFF;
      font-size: 14px;
      display: none;
    }

    .result.success {
      background: rgba(76, 175, 80, 0.25);
      border: 1px solid rgba(76, 175, 80, 0.5);
      display: block;
    }

    .result.error {
      background: rgba(244, 67, 54, 0.25);
      border: 1px solid rgba(244, 67, 54, 0.5);
      display: block;
    }

    .deleted-list {
      margin-top: 12px;
      padding-left: 20px;
    }

    .deleted-list li {
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🗑️ イベント削除</h1>
    <p class="subtitle">タイトルでイベントを削除します</p>

    <form id="deleteForm">
      <div class="form-group">
        <label for="title">削除するイベントのタイトル</label>
        <input
          type="text"
          id="title"
          name="title"
          placeholder="例: n"
          required
        >
      </div>

      <button type="submit" id="submitBtn">
        削除する
      </button>
    </form>

    <div id="result" class="result"></div>
  </div>

  <script>
    const form = document.getElementById('deleteForm');
    const submitBtn = document.getElementById('submitBtn');
    const resultDiv = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const title = document.getElementById('title').value.trim();

      if (!title) {
        showResult('error', 'タイトルを入力してください');
        return;
      }

      // 確認ダイアログ
      if (!confirm(`本当にタイトル「${title}」のイベントを削除しますか？\nこの操作は取り消せません。`)) {
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '削除中...';

      try {
        const response = await fetch('/api/admin/delete-event-by-title', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ title }),
        });

        const data = await response.json();

        if (response.ok) {
          let message = `✓ ${data.message}\n\n削除されたイベント:`;
          if (data.deletedEvents && data.deletedEvents.length > 0) {
            message += '<ul class="deleted-list">';
            data.deletedEvents.forEach(event => {
              message += `<li>${event.title} (ID: ${event.id})</li>`;
            });
            message += '</ul>';
            message += `\n残りのイベント数: ${data.remainingEvents}件`;
          }
          showResult('success', message);
          form.reset();
        } else {
          showResult('error', `エラー: ${data.error}`);
        }
      } catch (error) {
        console.error('削除エラー:', error);
        showResult('error', `エラー: ${error.message}`);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '削除する';
      }
    });

    function showResult(type, message) {
      resultDiv.className = `result ${type}`;
      resultDiv.innerHTML = message;
    }
  </script>
</body>
</html>
