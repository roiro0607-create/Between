<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>不正イベントクリーンアップ - Between Admin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: linear-gradient(135deg, #4a6fa5 0%, #6a8db5 30%, #a89884 70%, #be896f 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #FFFFFF;
      font-size: 28px;
      margin-bottom: 10px;
      text-align: center;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      text-align: center;
      margin-bottom: 30px;
    }

    .warning {
      background: rgba(255, 200, 100, 0.3);
      border: 1px solid rgba(255, 200, 100, 0.5);
      border-radius: 12px;
      padding: 16px;
      color: #FFFFFF;
      font-size: 14px;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 100, 100, 0.3);
      background: rgba(255, 100, 100, 0.25);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    button:hover {
      background: rgba(255, 100, 100, 0.35);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 100, 100, 0.3);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      color: #FFFFFF;
      font-size: 14px;
      display: none;
    }

    .result.success {
      background: rgba(76, 175, 80, 0.25);
      border: 1px solid rgba(76, 175, 80, 0.5);
      display: block;
    }

    .result.error {
      background: rgba(244, 67, 54, 0.25);
      border: 1px solid rgba(244, 67, 54, 0.5);
      display: block;
    }

    .deleted-list {
      margin-top: 12px;
      padding-left: 20px;
      max-height: 300px;
      overflow-y: auto;
    }

    .deleted-list li {
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧹 不正イベントクリーンアップ</h1>
    <p class="subtitle">タイトルなし・募集人数未設定のイベントを削除</p>

    <div class="warning">
      ⚠️ このボタンを押すと、以下の条件に該当するイベントが削除されます：<br>
      • タイトルが空または未設定<br>
      • 募集人数が未定義または不正な値<br>
      • 説明が空または未設定
    </div>

    <button id="cleanupBtn" onclick="cleanup()">
      クリーンアップを実行
    </button>

    <div id="result" class="result"></div>
  </div>

  <script>
    async function cleanup() {
      const btn = document.getElementById('cleanupBtn');
      const resultDiv = document.getElementById('result');

      if (!confirm('不正なイベントをすべて削除しますか？\nこの操作は取り消せません。')) {
        return;
      }

      btn.disabled = true;
      btn.textContent = 'クリーンアップ中...';

      try {
        const response = await fetch('/api/admin/cleanup-invalid-events', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
        });

        console.log('Response status:', response.status);

        const text = await response.text();
        console.log('Response text:', text);

        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          showResult('error', `JSONパースエラー: ${text.substring(0, 100)}`);
          return;
        }

        if (response.ok) {
          let message = `✓ ${data.message}`;
          if (data.deletedEvents && data.deletedEvents.length > 0) {
            message += '<br><br>削除されたイベント:';
            message += '<ul class="deleted-list">';
            data.deletedEvents.forEach(event => {
              message += `<li>${event.title} (ID: ${event.id}, 理由: ${event.reason})</li>`;
            });
            message += '</ul>';
            message += `<br>残りのイベント数: ${data.remainingEvents}件`;
          } else {
            message += '<br><br>削除対象のイベントはありませんでした。';
          }
          showResult('success', message);
        } else {
          showResult('error', `エラー: ${data.error}`);
        }
      } catch (error) {
        console.error('クリーンアップエラー:', error);
        showResult('error', `エラー: ${error.message}`);
      } finally {
        btn.disabled = false;
        btn.textContent = 'クリーンアップを実行';
      }
    }

    function showResult(type, message) {
      const resultDiv = document.getElementById('result');
      resultDiv.className = `result ${type}`;
      resultDiv.innerHTML = message;
    }
  </script>
</body>
</html>
