<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- マーブル調グラデーション（青とベージュ） -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a6fa5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7a8faa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#be896f;stop-opacity:1" />
    </linearGradient>

    <!-- ソフトシャドウ -->
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="64" height="64" rx="14" fill="url(#bgGradient)"/>

  <!-- マーブル模様のアクセント -->
  <circle cx="12" cy="12" r="8" fill="#6a8db5" opacity="0.3"/>
  <circle cx="52" cy="52" r="10" fill="#D9CFC1" opacity="0.25"/>
  <circle cx="20" cy="50" r="6" fill="#8fa5b0" opacity="0.2"/>

  <!-- "B" の文字 - 白色で視認性向上 -->
  <text x="32" y="45"
        font-family="'Georgia', 'Times New Roman', serif"
        font-size="38"
        font-weight="600"
        fill="#FFFFFF"
        text-anchor="middle"
        filter="url(#softShadow)">B</text>

  <!-- アクセントの小さな装飾 -->
  <circle cx="46" cy="22" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="18" cy="32" r="2" fill="#FFFFFF" opacity="0.4"/>
</svg>
