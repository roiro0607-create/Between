<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- ナチュラルなグラデーション -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F1E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D9CFC1;stop-opacity:1" />
    </linearGradient>

    <!-- ソフトシャドウ -->
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="64" height="64" rx="14" fill="url(#bgGradient)"/>

  <!-- "B" の文字 - ナチュラルでエレガントなスタイル -->
  <text x="32" y="45"
        font-family="'Georgia', 'Times New Roman', serif"
        font-size="38"
        font-weight="600"
        fill="#4A3428"
        text-anchor="middle"
        filter="url(#softShadow)">B</text>

  <!-- アクセントの小さな装飾 -->
  <circle cx="46" cy="22" r="2.5" fill="#B67352" opacity="0.6"/>
  <circle cx="18" cy="50" r="2" fill="#B67352" opacity="0.4"/>
</svg>
