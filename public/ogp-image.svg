<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- マーブル調背景グラデーション（青とベージュ） -->
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a6fa5;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#6a8db5;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#a89884;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#be896f;stop-opacity:1" />
    </linearGradient>

    <!-- アクセントグラデーション -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.7" />
    </linearGradient>

    <!-- ソフトシャドウ -->
    <filter id="textShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#mainBg)"/>

  <!-- マーブル模様の装飾的な円形要素 -->
  <ellipse cx="150" cy="100" rx="120" ry="100" fill="#6a8db5" opacity="0.15"/>
  <ellipse cx="1050" cy="530" rx="140" ry="120" fill="#D9CFC1" opacity="0.12"/>
  <ellipse cx="950" cy="150" rx="90" ry="80" fill="#8fa5b0" opacity="0.13"/>
  <ellipse cx="200" cy="500" rx="100" ry="90" fill="#c4a68a" opacity="0.11"/>
  <ellipse cx="600" cy="315" rx="80" ry="70" fill="#b3a08f" opacity="0.08"/>

  <!-- トップのアクセントライン -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#accentGradient)"/>

  <!-- ロゴマーク (大きな "B") -->
  <g transform="translate(100, 150)">
    <circle cx="60" cy="60" r="60" fill="#FFFFFF" opacity="0.15"/>
    <circle cx="60" cy="60" r="55" fill="rgba(255,255,255,0.1)"/>
    <text x="60" y="92"
          font-family="'Georgia', 'Times New Roman', serif"
          font-size="72"
          font-weight="600"
          fill="#FFFFFF"
          text-anchor="middle"
          filter="url(#textShadow)">B</text>
  </g>

  <!-- メインタイトル "Between" -->
  <text x="220" y="230"
        font-family="'Georgia', 'Times New Roman', serif"
        font-size="84"
        font-weight="700"
        fill="#FFFFFF"
        filter="url(#textShadow)">Between</text>

  <!-- サブタイトル -->
  <text x="220" y="300"
        font-family="'Noto Sans JP', sans-serif"
        font-size="38"
        font-weight="500"
        fill="#FFFFFF"
        opacity="0.95">気軽に人と繋がるイベントマッチング</text>

  <!-- 説明文 -->
  <text x="220" y="380"
        font-family="'Noto Sans JP', sans-serif"
        font-size="26"
        font-weight="400"
        fill="#FFFFFF"
        opacity="0.9">興味のあるイベントで新しい出会いを創る</text>

  <!-- 特徴を表すアイコン風の装飾 -->
  <g transform="translate(220, 440)">
    <!-- カフェ -->
    <circle cx="20" cy="20" r="18" fill="#FFFFFF" opacity="0.2"/>
    <text x="20" y="28" font-size="20" text-anchor="middle">☕</text>
    <text x="55" y="28"
          font-family="'Noto Sans JP', sans-serif"
          font-size="20"
          fill="#FFFFFF"
          opacity="0.95">カフェ</text>

    <!-- グルメ -->
    <circle cx="180" cy="20" r="18" fill="#FFFFFF" opacity="0.2"/>
    <text x="180" y="28" font-size="20" text-anchor="middle">🍽️</text>
    <text x="215" y="28"
          font-family="'Noto Sans JP', sans-serif"
          font-size="20"
          fill="#FFFFFF"
          opacity="0.95">グルメ</text>

    <!-- 趣味 -->
    <circle cx="340" cy="20" r="18" fill="#FFFFFF" opacity="0.2"/>
    <text x="340" y="28" font-size="20" text-anchor="middle">🎨</text>
    <text x="375" y="28"
          font-family="'Noto Sans JP', sans-serif"
          font-size="20"
          fill="#FFFFFF"
          opacity="0.95">趣味</text>
  </g>

  <!-- ボトムのアクセント -->
  <rect x="220" y="540" width="150" height="4" fill="#FFFFFF" opacity="0.5" rx="2"/>
</svg>
